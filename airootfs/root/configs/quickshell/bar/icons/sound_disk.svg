<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Icon Symbol Gradient (Classic Apple Silver/White) -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D1D6" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the Control Symbol -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

    <!-- Outer Disc Layer -->
    <path fill-rule="evenodd" fill="none" d="
      M 50,10 
      A 40,40 0 1,0 50,90 
      A 40,40 0 1,0 50,10 
      Z
      M 50,42 
      A 8,8 0 1,1 50,58 
      A 8,8 0 1,1 50,42 
      Z" />

    <!-- Concentric Grooves (Apple SF / Music CD detail) -->
    <circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="1" fill="none" opacity="1" />
    <circle cx="50" cy="50" r="24" stroke="currentColor" stroke-width="1" fill="none" opacity="1" />
    <circle cx="50" cy="50" r="16" stroke="currentColor" stroke-width="1" fill="none" opacity="1" />

    <!-- Center Spindle Hole -->
    <!-- <circle cx="50" cy="50" r="4" fill="currentColor" opacity="0.25" /> -->
    <circle cx="50" cy="50" r="8" stroke="currentColor" stroke-width="1" fill="none" opacity="1" />
</svg>
